<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>타이머</title>
<meta name="theme-color" content="#262626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="타이머">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- 라운드 / 타바타 공용 화면 -->
  <section id="view-timer" class="view active">
    <header class="top">
      <button class="icon-btn" id="btn-settings" aria-label="설정">⚙︎</button>
      <div class="top-center">
        <div class="top-title" id="mode-title">라운드</div>
        <div class="top-total" id="total-left">05:10</div>
      </div>
      <button class="icon-btn round-btn" id="btn-reset" aria-label="초기화">↻</button>
    </header>

    <div class="phase" id="phase-box">
      <div class="phase-name" id="phase-name">준비</div>
      <div class="phase-time" id="phase-time">00:10</div>
    </div>

    <div class="info-box" id="info-box">
      <div class="info-label" id="info-label">운동</div>
      <div class="info-time" id="info-time">01:00</div>
    </div>

    <div class="controls">
      <div class="rounds-left"><b id="rounds-left">5</b><span>남은 라운드</span></div>
      <div class="play-wrap">
        <button class="play" id="btn-play" aria-label="시작"><span id="play-icon">▶</span></button>
        <div class="play-label" id="play-label">시작</div>
      </div>
      <div class="spacer"></div>
    </div>
  </section>

  <!-- 스톱워치 -->
  <section id="view-stopwatch" class="view">
    <header class="top"><div class="top-center"><div class="top-title">스톱워치</div></div></header>
    <div class="phase sw-box"><div class="phase-time sw-time" id="sw-time">00:00.0</div></div>
    <ul class="laps" id="laps"></ul>
    <div class="controls">
      <div class="spacer"></div>
      <div class="play-wrap">
        <button class="play" id="sw-play" aria-label="시작"><span id="sw-icon">▶</span></button>
        <div class="play-label" id="sw-label">시작</div>
      </div>
      <div class="side-btns">
        <button class="pill" id="sw-lap">랩</button>
        <button class="pill" id="sw-reset">초기화</button>
      </div>
    </div>
  </section>

  <!-- 더보기 -->
  <section id="view-more" class="view">
    <header class="top"><div class="top-center"><div class="top-title">더보기</div></div></header>
    <div class="more">
      <h3>🎉 깜짝 이벤트</h3>
      <label class="row"><span>시작 누르면 깜짝 사진</span><input type="checkbox" id="opt-prank" checked></label>
      <label class="row"><span>효과음</span><input type="checkbox" id="opt-sound" checked></label>
      <label class="row"><span>진동</span><input type="checkbox" id="opt-vibrate" checked></label>
      <div class="row col">
        <span>깜짝 사진 바꾸기</span>
        <div class="prank-preview"><img id="prank-preview" alt=""></div>
        <div class="btn-row">
          <label class="pill file">사진 선택<input type="file" id="prank-file" accept="image/*" hidden></label>
          <button class="pill" id="prank-reset">기본으로</button>
          <button class="pill" id="prank-test">미리보기</button>
        </div>
        <small>선택한 사진은 이 기기에만 저장돼요.</small>
      </div>
    </div>
  </section>

  <nav class="tabbar">
    <button class="tab active" data-tab="tabata"><i>⏱</i><span>타바타</span></button>
    <button class="tab" data-tab="round"><i>◔</i><span>라운드</span></button>
    <button class="tab" data-tab="stopwatch"><i>◉</i><span>스톱워치</span></button>
    <button class="tab" data-tab="more"><i>⋯</i><span>더보기</span></button>
  </nav>
</div>

<!-- 설정 시트 -->
<div id="sheet" class="sheet" hidden>
  <div class="sheet-body">
    <h3 id="sheet-title">설정</h3>
    <label class="field"><span>준비 (초)</span><input type="number" id="f-prep" min="0" max="600" inputmode="numeric"></label>
    <label class="field"><span>운동 (초)</span><input type="number" id="f-work" min="1" max="3600" inputmode="numeric"></label>
    <label class="field"><span>휴식 (초)</span><input type="number" id="f-rest" min="0" max="3600" inputmode="numeric"></label>
    <label class="field"><span>라운드</span><input type="number" id="f-rounds" min="1" max="99" inputmode="numeric"></label>
    <div class="btn-row"><button class="pill" id="sheet-cancel">취소</button><button class="pill primary" id="sheet-save">저장</button></div>
  </div>
</div>

<!-- 깜짝 오버레이 -->
<div id="prank" class="prank" hidden>
  <canvas id="confetti"></canvas>
  <div class="prank-card" id="prank-card">
    <img id="prank-img" alt="">
    <div class="prank-fallback" id="prank-fallback">🤪</div>
    <div class="prank-text">띠용~~!! 🎉</div>
    <div class="prank-hint">화면을 터치하면 타이머가 시작돼요</div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
